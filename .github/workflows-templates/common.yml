name: Build GAME_NAME Image

on:
    push:
        branches:
            - main
        paths:
            - "GAME_NAME/**"
            - ".github/workflows/build-image-GAME_NAME.yml"
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            
            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
            
            # 获取当前日期 (yyyy-MM-dd) 并强制用户名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT
            
            # 执行构建与推送
            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  # 调整上下文目录
                  context: ./GAME_NAME
                  push: true
                  # 同时打上 latest 和 日期 tag
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/GAME_NAME:${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/GAME_NAME:latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/GAME_NAME:${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/GAME_NAME:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
