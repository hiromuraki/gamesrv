name: Build and Push CS 1.6 Server Images

on:
    push:
        branches:
            - main
            - master
        paths:
            - 'counter-strike/**'
            - '.github/workflows/build-image-counter-strike.yml'
    pull_request:
        branches:
            - main
            - master
        paths:
            - 'counter-strike/**'
            - '.github/workflows/build-image-counter-strike.yml'
    workflow_dispatch:

env:
    # 默认推送到 GitHub 自带的镜像仓库 (GHCR)
    REGISTRY: ghcr.io
    # 你的 GitHub 用户名/仓库名，例如 octocat/cstrike
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        # 使用矩阵 (Matrix) 同时并行构建多个分支模式
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: base
                      tag_suffix: base-latest
                    - target: dm
                      tag_suffix: dm-latest
                    - target: versus
                      tag_suffix: versus-latest

        # 赋予 GITHUB_TOKEN 推送镜像到包仓库的权限
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # 1. 开启 Docker Buildx 以支持高级缓存和目标构建
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 2. 登录到 GitHub 容器镜像库 (GHCR)
            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 3. 提取镜像的 Metadata (用于自动打 Tag 和 Label)
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ matrix.tag_suffix }}

            # 4. 执行多阶段构建并推送
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./counter-strike
                  push: true
                  # 只要构建到矩阵当前的目标阶段即可
                  target: ${{ matrix.target }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # 使用 GitHub Actions 原生缓存网络
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
