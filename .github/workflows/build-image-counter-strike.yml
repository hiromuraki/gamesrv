name: Build and Push CS 1.6 Server Images

on:
    push:
        branches:
            - main
        paths:
            - "counter-strike/**"
            - ".github/workflows/build-image-counter-strike.yml"
    workflow_dispatch:

env:
    # 默认推送到 GitHub 自带的镜像仓库 (GHCR)
    REGISTRY: ghcr.io
    # GitHub 用户名/仓库名，例如 octocat/cstrike
    IMAGE_NAME: ${{ github.repository_owner }}/counter-strike

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        # 取消了 strategy matrix，所有操作在同一台 Runner 上串行执行，确保共享 BuildKit 缓存
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ---------------------------------------------------
            # 1. 优先构建 Base 阶段
            # ---------------------------------------------------
            - name: Build and push Base image
              uses: docker/build-push-action@v5
              with:
                  context: ./counter-strike
                  push: true
                  target: base
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ---------------------------------------------------
            # 2. 构建 DM 模式 (极速)
            # ---------------------------------------------------
            - name: Build and push DM image
              uses: docker/build-push-action@v5
              with:
                  context: ./counter-strike
                  push: true
                  target: dm
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dm
                  # 这里只需要读取缓存即可，无需生成新缓存
                  cache-from: type=gha

            # ---------------------------------------------------
            # 3. 构建 Versus 模式
            # ---------------------------------------------------
            - name: Build and push Versus image
              uses: docker/build-push-action@v5
              with:
                  context: ./counter-strike
                  push: true
                  target: versus
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:versus
                  cache-from: type=gha
