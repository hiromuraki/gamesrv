name: Build and Push Warfork Server Images

on:
    push:
        branches:
            - main
        paths:
            - "warfork/**"
            - ".github/workflows/build-image-warfork.yml"
    workflow_dispatch:

env:
    # 默认推送到 GitHub 自带的镜像仓库 (GHCR)
    REGISTRY: ghcr.io
    # GitHub 用户名/仓库名，例如 octocat/cstrike
    IMAGE_NAME: ${{ github.repository_owner }}/warfork

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ---------------------------------------------------
            # 1. 优先构建 Base 阶段
            # ---------------------------------------------------
            - name: Build and push Base image
              uses: docker/build-push-action@v5
              with:
                  context: ./warfork
                  push: true
                  target: base
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ---------------------------------------------------
            # 3. 构建 Dual 模式
            # ---------------------------------------------------
            - name: Build and push Dual image
              uses: docker/build-push-action@v5
              with:
                  context: ./warfork
                  push: true
                  target: dual
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dual
                  cache-from: type=gha
            
            # ---------------------------------------------------
            # 3. 构建 Deathmatch 模式
            # ---------------------------------------------------
            - name: Build and push Dual image
              uses: docker/build-push-action@v5
              with:
                  context: ./warfork
                  push: true
                  target: dm
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dm
                  cache-from: type=gha